name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-write-lock-file

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            compiler: gcc
          - runner: ubuntu-24.04
            compiler: clang
          - runner: ubuntu-24.04-arm
            compiler: gcc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake pkg-config libudev-dev libevdev-dev

      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          -DKEYSHARP_INPUT_SETUP_ON_INSTALL=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify metadata and install tree
        run: |
          ./build/keysharp-input version
          ./build/keysharp-input info
          DESTDIR="$RUNNER_TEMP/install-root" cmake --install build
          test -x "$RUNNER_TEMP/install-root/usr/local/bin/keysharp-input"
          test -f "$RUNNER_TEMP/install-root/usr/local/lib/libkeysharp-input.so.0"
          test -f "$RUNNER_TEMP/install-root/usr/local/include/keysharp_input/client.h"
          test -f "$RUNNER_TEMP/install-root/usr/local/include/keysharp_input/constants.h"
          test -f "$RUNNER_TEMP/install-root/etc/systemd/system/keysharp-input.service"
          test -f "$RUNNER_TEMP/install-root/etc/systemd/system/keysharp-input.socket"
          grep -Fq 'ExecStart=/usr/local/bin/keysharp-input daemon --system-service' \
            "$RUNNER_TEMP/install-root/etc/systemd/system/keysharp-input.service"
          test -f "$RUNNER_TEMP/install-root/usr/share/polkit-1/actions/org.keysharp.input.policy"
          test -f "$RUNNER_TEMP/install-root/usr/local/lib/tmpfiles.d/keysharp-input-permissions.conf"
          test ! -e "$RUNNER_TEMP/install-root/usr/local/lib/systemd/system/keysharp-input.service"
          test ! -e "$RUNNER_TEMP/install-root/usr/local/lib/udev/rules.d/70-keysharp-input-uaccess.rules"
          cmake -S tests/install-consumer -B "$RUNNER_TEMP/consumer-build" \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/install-root/usr/local"
          cmake --build "$RUNNER_TEMP/consumer-build"
          LD_LIBRARY_PATH="$RUNNER_TEMP/install-root/usr/local/lib" \
            "$RUNNER_TEMP/consumer-build/keysharp-input-install-consumer"

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Check lifecycle scripts
        run: shellcheck install.sh uninstall.sh packaging/install-release.sh packaging/debian/*
